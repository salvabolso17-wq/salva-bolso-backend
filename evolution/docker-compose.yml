# Evolution API — Docker Compose para EasyPanel / VPS
#
# Uso com EasyPanel:
#   Opção A (recomendado): crie cada serviço individualmente pelo painel
#   Opção B: SSH na VPS → cd evolution → docker compose up -d
#
# Este arquivo inclui Evolution API + Redis.
# O PostgreSQL NÃO está aqui pois o projeto já tem um rodando no EasyPanel.
# A Evolution API se conecta via DATABASE_CONNECTION_URI no .env

version: "3.9"

services:

  # ── Evolution API ────────────────────────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: salva_bolso_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Sessões do WhatsApp Web — NÃO apague este volume ou terá que escanear o QR novamente
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Redis — cache de sessões e filas ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: salva_bolso_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  evolution_instances:
    driver: local
  redis_data:
    driver: local

# ── Redes ────────────────────────────────────────────────────────────────────
networks:
  evolution-net:
    driver: bridge
